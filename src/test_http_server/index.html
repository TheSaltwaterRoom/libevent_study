<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libevent HTTP Server</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f2f4f8;
            color: #333;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 60px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #2c7be5;
            text-align: center;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-left: 5px solid #4caf50;
            font-size: 18px;
        }

        .box {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 24px;
            font-size: 16px;
            color: white;
            background: #2c7be5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1a68d1;
        }

        pre {
            margin-top: 20px;
            padding: 15px;
            background: #222;
            color: #0f0;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Libevent HTTP Server</h1>

        <div class="status">
            HTTP Server is running. 200 OK
        </div>

        <div class="box">
            <h2>发送测试数据到服务器</h2>

            <textarea id="inputData">Hello Libevent Server</textarea>

            <br>

            <button onclick="sendData()">发送 POST 请求</button>

            <pre id="result">等待服务器响应...</pre>
            <img src="test.jpg" />
        </div>

        <div>
            <form method="post">
                <input type="text" name="username" />
                <input type="password" name="password" />
                <input type="submit" value="submit" />
            </form>

        </div>
    </div>

    <script>
        function sendData() {
            const data = document.getElementById("inputData").value;
            const result = document.getElementById("result");

            fetch("/test", {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: data
            })
            .then(response => response.text())
            .then(text => {
                result.textContent = "服务器返回：\n" + text;
            })
            .catch(error => {
                result.textContent = "请求失败：\n" + error;
            });
        }
    </script>
</body>
</html>
